# Bug and feature templates only — blank issues are disabled so reports arrive structured.
#
# There are deliberately no `contact_links` here. GitHub requires ABSOLUTE URLs in that block
# and will not resolve a relative path, so a link can only be added once this repository has a
# real owner/name. Shipping https://github.com/OWNER/REPO/... would put a broken link in the
# issue chooser, which is worse than no link.
#
# To add them after the repository exists, restore this block with the real owner and name:
#
# contact_links:
#   - name: 🔒 Security vulnerability
#     url: https://github.com/<owner>/<repo>/security/advisories/new
#     about: Do NOT open a public issue. Report privately — see SECURITY.md for what is in scope.
#   - name: ❓ Question or setup help
#     url: https://github.com/<owner>/<repo>/blob/main/SUPPORT.md
#     about: Read SUPPORT.md first — the two most common "bugs" are a stopped worker and a wrong CORS_ORIGINS.
#
# Until then, SECURITY.md and SUPPORT.md carry the same guidance and are linked from README.md.
blank_issues_enabled: false
